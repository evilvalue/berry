# AutoModpack is shipped only because the server requires the mod on both sides.
# The pack itself is distributed by packwiz now, so this client never selects or
# downloads an AutoModpack pack; mods live in the normal mods/ folder.
update-selected-modpack-on-launch: false
self-updater: false
sync-automodpack-version: false
sync-versions: false
play-music: false
show-modpack-settings-button: false
pinned-mod-ids: []
